<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tablero">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tablero · Max</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0a0c0f;--p1:#111418;--p2:#171b21;--p3:#1e232b;--bd:#262c36;--bd2:#323946;--tx:#e7e9ec;--mu:#8b93a1;--mu2:#5f6774;--ac:#4c8dff;--ac2:#2f6fe0;--ok:#2fb67c;--wa:#e0a43a;--er:#e5534b;--r:8px;font-size:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a303a;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
a{color:var(--ac);cursor:pointer;text-decoration:none}
input,select,textarea{background:var(--p2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:8px 10px;font:inherit;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=date],input[type=month],input[type=time]{color-scheme:dark}
input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px;margin:0;cursor:pointer;flex:none}
textarea{resize:vertical;width:100%;line-height:1.45}
.btn{background:var(--p3);border:1px solid var(--bd2);color:var(--tx);border-radius:6px;padding:8px 12px;font:inherit;font-weight:550;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:#4a5463}
.btn.pri{background:var(--ac2);border-color:var(--ac2);color:#fff}.btn.pri:hover{background:var(--ac)}
.btn.ok{background:#143a29;border-color:#1f6b47;color:#8fe3b9}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mu)}.btn.ghost:hover{color:var(--tx);background:var(--p2)}
.btn.danger{background:#3a1a1a;border-color:#6b2a27;color:#ffb4ae}
.btn.full{width:100%;justify-content:flex-start}
.btn:disabled{opacity:.5;cursor:default}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}.warn{color:var(--wa)}.err{color:var(--er)}.okc{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.sp{flex:1}
.hide{display:none!important}
/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{width:min(360px,100%);background:var(--p1);border:1px solid var(--bd);border-radius:12px;padding:26px;display:flex;flex-direction:column;gap:10px}
.lc .lm{font-size:12.5px;color:var(--mu);text-align:center;margin-top:4px}
.brand{font-weight:650;font-size:16px;letter-spacing:.2px}
.brand{display:flex;align-items:center;gap:11px}.brand .logo{height:24px;width:auto;flex:none}.tlogo{height:18px;width:auto}
.brand small{display:block;color:var(--mu);font-weight:550;font-size:11px;margin-top:3px;letter-spacing:.5px;text-transform:uppercase}
/* Layout */
#side{position:fixed;left:0;top:0;bottom:0;width:224px;background:var(--p1);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;z-index:6}
.nav{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--mu);cursor:pointer;font-weight:550}
.nav a svg{width:16px;height:16px;flex:none;opacity:.85}
.nav a:hover{background:var(--p2);color:var(--tx)}
.nav a.on{background:var(--p3);color:var(--tx)}
.nav .c{margin-left:auto;font-size:11.5px;color:var(--mu2);font-variant-numeric:tabular-nums}
.nav .c.alert{color:var(--er);font-weight:650}
.sfoot{margin-top:auto;border-top:1px solid var(--bd);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.sfoot .info{font-size:11.5px;color:var(--mu2);padding:2px 4px;line-height:1.5;word-break:break-all}
#wrap{margin-left:224px;min-height:100vh}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 24px;background:rgba(10,12,15,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd)}
#top h1{font-size:17px;font-weight:620;margin:0;white-space:nowrap}
#q{width:280px}
.esps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.esps::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--bd2);color:var(--mu);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;background:transparent}
.chip.on{color:var(--tx);background:var(--p3);border-color:#4a5463}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
main{padding:20px 24px 80px}
#bnav{display:none}
/* Componentes */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.kpi:hover{border-color:var(--bd2)}
.kpi .l{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:650}
.kpi .v{font-size:24px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--mu);margin-top:2px}
.sec{margin-top:24px}
.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:650;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.sec h2 .r{margin-left:auto;text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid2>div{min-width:0}
.grid2.wide{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
main{overflow-x:hidden}
.list{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer;min-height:46px}
.li:last-child{border-bottom:none}
.li:hover{background:var(--p2)}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:560;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12px;color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip{flex:none;width:46px;text-align:center;border:1px solid var(--bd2);border-radius:6px;padding:3px 0;line-height:1.15}
.dchip b{display:block;font-size:15px}.dchip span{font-size:10px;text-transform:uppercase;color:var(--mu);font-weight:650}
.dchip.past{border-color:#6b2a27;background:#2a1414}.dchip.past b{color:#ff8f88}
.dchip.today{border-color:var(--ac2);background:#122038}
.amt{font-weight:620;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap}
.etag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mu);white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r);padding:8px;min-height:140px}
.col.over{border-color:var(--ac);background:#121a26}
.colh{display:flex;align-items:center;gap:7px;padding:4px 4px 9px;font-weight:620;font-size:12.5px}
.colh .n{margin-left:auto;color:var(--mu2);font-weight:550}
.card{background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--bd2)}
.card .t{font-weight:560;line-height:1.32}
.card .m{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--mu);align-items:center}
.tbl{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);font-weight:650;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none}
th.s{color:var(--tx)}
td{padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.rw{cursor:pointer}tr.rw:hover td{background:var(--p2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters label.ck{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:none;color:var(--mu);padding:7px 11px;font:inherit;font-weight:550;cursor:pointer;font-size:13px}
.seg button.on{background:var(--p3);color:var(--tx)}
.bar{height:6px;background:var(--p3);border-radius:4px;overflow:hidden;display:flex}
.mbar{display:inline-flex;align-items:center;gap:6px}.mbar .bar{width:46px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pc{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.pc .pt{font-weight:620;font-size:15px}
.pc .tl{margin-top:10px;border-top:1px solid var(--bd);padding-top:6px}
.pc .tl div{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.pc .tl div:hover span.tn{color:var(--ac)}
.pc .tl span.tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mu);padding:28px;text-align:center;border:1px dashed var(--bd);border-radius:8px}
.why{font-size:11px;font-weight:650;padding:2px 7px;border-radius:4px;white-space:nowrap}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sum .kpi{cursor:default;min-width:170px;flex:1}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.cal .h{background:var(--p1);padding:7px;font-size:11px;text-transform:uppercase;color:var(--mu);font-weight:650;text-align:center}
.cal .d{background:var(--p1);min-height:92px;padding:5px 6px;cursor:pointer;overflow:hidden}
.cal .d:hover{background:var(--p2)}
.cal .d.out{background:#0d1013}.cal .d.out .n{color:var(--mu2)}
.cal .d.sel{outline:2px solid var(--ac2);outline-offset:-2px}
.cal .d .n{font-size:12px;font-weight:600;color:var(--mu)}
.cal .d.today .n{background:var(--ac2);color:#fff;border-radius:4px;padding:0 5px;display:inline-block}
.cal .ev{font-size:11px;padding:1px 5px;border-radius:3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid}
/* Drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(700px,100%);background:var(--p1);border-left:1px solid var(--bd2);transform:translateX(102%);transition:transform .18s ease;z-index:20;display:flex;flex-direction:column;box-shadow:-24px 0 48px rgba(0,0,0,.45)}
#drawer.on{transform:none}
.dh{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);padding-top:max(12px,env(safe-area-inset-top))}
.dh .ttl{flex:1;font-size:16px;font-weight:620;background:transparent;border-color:transparent}
.dh .ttl:hover{border-color:var(--bd)}.dh .ttl:focus{border-color:var(--ac)}
.db{flex:1;overflow:auto;padding:16px 18px 30px;-webkit-overflow-scrolling:touch}
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.f label{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:650;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%}
.ds{margin-top:22px}
.ds h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);margin:0 0 8px;font-weight:650;display:flex;align-items:center;gap:8px}
.ds h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;display:flex;gap:6px;align-items:center}
.chk{display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;margin-bottom:5px;background:var(--p2)}
.chk span{flex:1;outline:none}
.chk.done span{text-decoration:line-through;color:var(--mu2)}
.x{opacity:.35;transition:opacity .1s}
.chk:hover .x,.att:hover .x,.log:hover .x{opacity:1}
.log{border-left:2px solid var(--bd2);padding:1px 0 11px 12px;margin-left:4px}
.log .d{font-size:11.5px;color:var(--mu);display:flex;gap:8px;align-items:center}
.log .tx{white-space:pre-wrap;margin-top:2px;line-height:1.45}
.log.sys{border-left-color:var(--bd)}.log.sys .tx{color:var(--mu);font-size:12.5px}
.log.usr{border-left-color:var(--ac2)}
.drop{border:1px dashed var(--bd2);border-radius:8px;padding:14px;text-align:center;color:var(--mu);cursor:pointer;font-size:13px}
.drop.over,.drop:hover{border-color:var(--ac);color:var(--tx)}
.att{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;margin-top:6px;background:var(--p2)}
.att .n{flex:1;min-width:0}
.att .n div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .k{font-size:10.5px;font-weight:700;color:var(--mu);background:var(--p3);border-radius:4px;padding:2px 6px;text-transform:uppercase;min-width:42px;text-align:center}
.df{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd);flex-wrap:wrap;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#modal{display:none}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;overflow:auto}
.mc{background:var(--p1);border:1px solid var(--bd2);border-radius:10px;width:min(540px,94vw);padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.5);margin-bottom:40px}
.mc h3{margin:0 0 14px;font-size:15px;font-weight:620}
.mc .f{margin-bottom:10px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.menu{display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--bd2);padding:9px 14px;border-radius:8px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#busy{position:fixed;top:0;left:0;height:2px;background:var(--ac);z-index:70;width:0;transition:width .3s}
.rep{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
.rep .pc .f{margin-bottom:10px}
.rep iframe{width:100%;height:calc(100vh - 120px);border:1px solid var(--bd);border-radius:8px;background:#0b0d10}
.hr{border-top:1px solid var(--bd);margin:12px 0}
.ck2{display:flex;align-items:center;gap:7px;color:var(--mu);margin:7px 0;cursor:pointer}
.kbd{font-size:11px;border:1px solid var(--bd2);border-radius:4px;padding:0 5px;color:var(--mu)}
.fab{display:none}
/* Espacios */
.ecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:18px}
.ecard{background:linear-gradient(180deg,color-mix(in srgb,var(--ec) 16%,var(--p1)) 0%,var(--p1) 70%);border:1px solid var(--bd);border-top:3px solid var(--ec);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .12s}
.ecard:hover{border-color:color-mix(in srgb,var(--ec) 60%,var(--bd))}
.ecard .eh{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px}
.ecard .em{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.ecard .em b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.ecard .em span{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;font-weight:650}
.ecard .en{margin-top:10px;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--bd);padding-top:8px}
.ebanner{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid color-mix(in srgb,var(--ec) 45%,var(--bd));background:color-mix(in srgb,var(--ec) 12%,var(--p1));border-radius:var(--r);margin-bottom:16px}
/* Mobile */
@media(max-width:860px){
  #side{display:none}
  #wrap{margin-left:0}
  #top{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));flex-wrap:wrap;gap:8px}
  #top h1{font-size:16px}
  #q{order:5;width:100%}
  .esps{order:6;width:100%}
  main{padding:14px 12px 110px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:21px}
  .grid2,.grid2.wide{grid-template-columns:minmax(0,1fr)}
  .fg{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:repeat(5,82vw);scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .rep{grid-template-columns:1fr}
  .rep iframe{height:70vh}
  .hm{display:none!important}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(17,20,24,.97);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
  #bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;color:var(--mu);font-size:10.5px;font-weight:600}
  #bnav a.on{color:var(--tx)}
  #bnav svg{width:20px;height:20px}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:16;width:52px;height:52px;border-radius:50%;background:var(--ac2);color:#fff;border:none;font-size:26px;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .cal .d{min-height:54px;padding:3px}
  .cal .ev{font-size:0;height:5px;padding:0;border-left:none;margin-top:2px}
  .mb{padding-top:4vh}
  input,select,textarea{font-size:16px}
  #toast{bottom:calc(140px + env(safe-area-inset-bottom))}
  :root{font-size:15.5px}
  .li{min-height:58px;padding:12px 12px;gap:12px}
  .li .t span{font-size:13px}
  .btn{padding:10px 14px}
  .btn.sm{padding:8px 12px;font-size:14px}
  .chip{padding:8px 14px;font-size:14px}
  .kpi .l{font-size:11.5px}
  .kpi .s{font-size:12.5px}
  .dchip{width:52px}.dchip b{font-size:17px}
  .pill{font-size:12.5px}
  th{font-size:12px}td{padding:12px 10px}
  .f label{font-size:12px}
  .ds h3{font-size:12.5px}
  .sec h2{font-size:13px}
  #bnav a{font-size:11.5px;padding:9px 0 8px}
  #bnav svg{width:23px;height:23px}
  .ecards{grid-template-columns:1fr}
  .ecard .em b{font-size:22px}
  .ecard .em span{font-size:10.5px}
  .card .t{font-size:15px}
  .sec h2{flex-wrap:wrap}
  .sec h2 .r{margin-left:0;width:100%;display:flex;gap:6px}
}
@media(min-width:861px){.sm-only{display:none!important}}
</style>
</head>
<body>
<div id="busy"></div>

<div id="login" class="login hide">
  <div class="lc">
    <div class="brand"><img src="logo.png" alt="MR" class="logo"><div>Tablero<small>Max Rolón</small></div></div>
    <div style="height:6px"></div>
    <input id="le" type="email" placeholder="Mail" autocomplete="username">
    <input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn pri" onclick="doLogin()">Ingresar</button>
    <div class="lm"><a onclick="doSignup()">Crear usuario</a> · <a onclick="doReset()">Olvidé mi contraseña</a></div>
    <div id="lerr" class="lm err"></div>
  </div>
</div>

let FER=new Set();
function ymd(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function easter(Y){const a=Y%19,b=Math.floor(Y/100),c=Y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return[Math.floor((h+l-7*m+114)/31),((h+l-7*m+114)%31)+1]}
function fallbackFer(y){const[em,ed]=easter(y);const E=ymd(y,em,ed);return[ymd(y,1,1),addDays(E,-48),addDays(E,-47),ymd(y,3,24),ymd(y,4,2),addDays(E,-2),ymd(y,5,1),ymd(y,5,25),ymd(y,6,20),ymd(y,7,9),ymd(y,12,8),ymd(y,12,25)]}
async function loadFeriados(){const y=new Date().getFullYear();for(const yy of[y,y+1]){let L=null;try{const c=JSON.parse(localStorage.getItem('tb_fer_'+yy)||'null');if(c&&Date.now()-c.t<15*864e5)L=c.L}catch(e){}
  if(!L){try{const r=await fetch('https://api.argentinadatos.com/v1/feriados/'+yy);if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length){L=j.map(x=>x.fecha).filter(Boolean);try{localStorage.setItem('tb_fer_'+yy,JSON.stringify({t:Date.now(),L}))}catch(e){}}}}catch(e){}}
  (L||fallbackFer(yy)).forEach(f=>FER.add(f))}}
function isHabil(iso){const wd=new Date(iso+'T12:00:00').getDay();return wd!==0&&wd!==6&&!FER.has(iso)}
function parseRec(s){const[per,rr]=String(s||'').split('|');const[regla,n]=String(rr||'').split(':');return{per:per||'',regla:regla||'',n:+n||0}}
function recLabel(s){const r=parseRec(s);if(!r.per)return '';let t=PERIODS[r.per]||r.per;if(r.regla==='ultimo')t+=' · último día';else if(r.regla==='dia')t+=' · día '+r.n;else if(r.regla==='habil')t+=' · '+r.n+'° día hábil';return t}
function dueInMonth(y,m,regla,n,refDay){const ld=lastDay(y,m);if(regla==='ultimo')return ymd(y,m,ld);if(regla==='dia')return ymd(y,m,Math.min(n||1,ld));if(regla==='habil'){let c=0;for(let d=1;d<=ld;d++){const iso=ymd(y,m,d);if(isHabil(iso)&&++c===(n||1))return iso}return ymd(y,m,ld)}return ymd(y,m,Math.min(refDay||1,ld))}
function nextDue(venc,rec){const r=parseRec(rec);const k=RECM[r.per];if(!k||!venc)return null;const[y,m,d]=venc.split('-').map(Number);const t=m-1+k;return dueInMonth(y+Math.floor(t/12),t%12+1,r.regla,r.n,d)}
function firstDue(rec){const r=parseRec(rec);if(!r.per||!r.regla)return null;const[y,m]=TODAY().split('-').map(Number);let f=dueInMonth(y,m,r.regla,r.n,1);if(f<TODAY()){const t=m;f=dueInMonth(y+Math.floor(t/12),t%12+1,r.regla,r.n,1)}return f}

function agendaItems(from,to,opts={}){
  const out=[];
  D.pagos.filter(inEsp).forEach(p=>{const st=pagoSt(p);if(st==='cancelado')return;
    if(st!=='pagado'&&p.vencimiento&&p.vencimiento<=to&&(p.vencimiento>=from||opts.overdue))out.push({k:'pago',id:p.id,fecha:p.vencimiento,titulo:p.concepto,sub:[p.categoria,mtxt(p)].filter(Boolean).join(' · '),esp:p.espacio_id,done:false,color:st==='vencido'?'#e5534b':'#e0a43a'});
    if(opts.paid&&st==='pagado'&&(p.fecha_pago||p.vencimiento)>=from&&(p.fecha_pago||p.vencimiento)<=to)out.push({k:'pago',id:p.id,fecha:p.fecha_pago||p.vencimiento,titulo:p.concepto,sub:'Pagado · '+money(p.monto,p.moneda),esp:p.espacio_id,done:true,color:'#2fb67c'})});
  D.recordatorios.filter(inEsp).forEach(r=>{if(r.fecha<=to&&(r.fecha>=from||(opts.overdue&&!r.hecho))&&(!r.hecho||opts.paid))out.push({k:'rec',id:r.id,fecha:r.fecha,titulo:r.titulo,sub:[r.hora?r.hora.slice(0,5):'',r.notas].filter(Boolean).join(' · '),esp:r.espacio_id,done:r.hecho,color:'#b07cff'})});
  D.temas.filter(t=>inEsp(t)&&isOpen(t)&&t.objetivo).forEach(t=>{if(t.objetivo<=to&&(t.objetivo>=from||opts.overdue))out.push({k:'tema',id:t.id,fecha:t.objetivo,titulo:t.titulo,sub:'Objetivo del tema · '+t.estado,esp:t.espacio_id,done:false,color:'#4c8dff'})});
  if(opts.prev)out.push(...projections({to}).filter(i=>i.fecha>=from));
  return out.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
}
let PROY=+(localStorage.getItem('tb_proy')||12);
function projections({cuenta=null,to}){const out=[];
  const series=D.pagos.filter(p=>p.recurrencia&&p.vencimiento&&p.estado!=='Cancelado'&&(cuenta?p.cuenta_id===cuenta:inEsp(p)));
  const last={};series.forEach(p=>{const k=(p.cuenta_id||norm(p.concepto))+'|'+(p.espacio_id||'')+'|'+p.recurrencia;if(!last[k]||p.vencimiento>last[k].vencimiento)last[k]=p});
  const lim=to||addMonths(TODAY(),PROY);
  Object.values(last).forEach(p=>{let d=p.vencimiento,n=0;while(n<120){d=nextDue(d,p.recurrencia);if(!d||d>lim)break;n++;out.push({k:'pago',id:p.id,fecha:d,titulo:p.concepto,sub:'Previsto · '+mtxt(p),esp:p.espacio_id,done:false,prev:true,color:'#e0a43a'})}});
  return out.sort((a,b)=>a.fecha<b.fecha?-1:1)}

function hayT(t){return norm([t.titulo,t.descripcion,t.area,t.contraparte,(t.tags||[]).join(' '),projName(t.proyecto_id),espName(t.espacio_id),t.estado,...pendsOf(t.id).map(p=>p.texto),...logsOf(t.id).map(b=>b.texto),...docsOf('tema_id',t.id).map(d=>d.nombre)].join(' '))}
function matchQ(h){if(!Q.trim())return true;return norm(Q).split(/\s+/).filter(Boolean).every(w=>h.includes(w))}
function filteredT(){
  let L=D.temas.filter(t=>inEsp(t)&&matchQ(hayT(t)));
  if(F.estado)L=L.filter(t=>t.estado===F.estado);else if(!F.cerrados&&!Q.trim()&&F.modo==='lista')L=L.filter(isOpen);
  if(F.proyecto)L=L.filter(t=>F.proyecto==='_none'?!t.proyecto_id:t.proyecto_id===F.proyecto);
  if(F.prio)L=L.filter(t=>t.prioridad===F.prio);
  if(F.flag==='atencion')L=L.filter(t=>vencido(t)||t.estado==='Bloqueado'||stale(t));
  const k=F.sort,d=F.dir,po={Alta:0,Media:1,Baja:2};
  L.sort((a,b)=>{let x,y;if(k==='prioridad'){x=po[a.prioridad];y=po[b.prioridad]}else if(k==='estado'){x=ESTADOS.indexOf(a.estado);y=ESTADOS.indexOf(b.estado)}else if(k==='proyecto'){x=projName(a.proyecto_id)||'~';y=projName(b.proyecto_id)||'~'}else if(k==='objetivo'){x=a.objetivo||'9999';y=b.objetivo||'9999'}else{x=a[k]||'';y=b[k]||''}return x<y?-d:x>y?d:0});
  return L;
}

  else if(PF.vista==='pagados'){L=L.filter(p=>pagoSt(p)==='pagado').sort((a,b)=>(a.fecha_pago||'')<(b.fecha_pago||'')?1:-1);title='Pagados'}
  else {L=L.filter(p=>(p.estado==='Pagado'?(p.fecha_pago||p.vencimiento||''):(p.vencimiento||'')).startsWith(PF.mes)).sort((a,b)=>(a.vencimiento||'')<(b.vencimiento||'')?-1:1);title='Mes '+PF.mes}

  const allE=D.pagos.filter(inEsp);
  const venc=allE.filter(p=>pagoSt(p)==='vencido'),p30=allE.filter(p=>pagoSt(p)==='pendiente'&&p.vencimiento&&daysTo(p.vencimiento)<=30);

  const fl=`<div class="filters"><div class="seg"><button class="${PF.vista==='apagar'?'on':''}" onclick="PF.vista='apagar';render()">A pagar</button><button class="${PF.vista==='pagados'?'on':''}" onclick="PF.vista='pagados';render()">Pagados</button><button class="${PF.vista==='mes'?'on':''}" onclick="PF.vista='mes';render()">Por mes</button></div>${PF.vista==='mes'?`<input type="month" value="${PF.mes}" onchange="PF.mes=this.value;render()">`:''}<select onchange="PF.cat=this.value;render()"><option value="">Categoría: todas</option>${PCATS.map(c=>`<option ${PF.cat===c?'selected':''}>${c}</option>`).join('')}</select><div class="sp"></div><span class="mu num" style="font-size:12.5px">${L.length} · ${tot(L)}</span><button class="btn sm hm" onclick="exportPagosCSV(window._pv)">⤓ CSV</button><button class="btn sm" onclick="go('cuentas')">${ICON.cuentas.replace('<svg','<svg width="14" height="14"')} Cuentas</button><button class="btn sm pri" onclick="newPago()">+ Pago</button></div>`;
  window._pv=L;
  if(!L.length)return sum+fl+`<div class="empty">${PF.vista==='apagar'?'No hay pagos pendientes.':'Sin pagos en esta vista.'} <a onclick="newPago()">Registrar uno</a></div>`;
  return sum+fl+`<div class="list">${L.map(p=>{const st=pagoSt(p);const f=st==='pagado'?(p.fecha_pago||p.vencimiento):p.vencimiento;const nd=docsOf('pago_id',p.id).length;return `<div class="li" style="${estripe(p.espacio_id)}" onclick="openDr('pago','${p.id}')">${f?dchip(f,st==='pagado'||st==='cancelado'):'<div class="dchip"><b>—</b><span>s/f</span></div>'}<div class="t"><b>${esc(p.concepto)}</b><span>${[p.cuenta_id&&cuentaName(p.cuenta_id)!==p.concepto?cuentaName(p.cuenta_id):'',p.categoria,!ESP?espName(p.espacio_id):'',p.recurrencia?'↻ '+recLabel(p.recurrencia):'',st==='pagado'&&p.medio?p.medio:'',nd?'📎 '+nd:''].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</span></div><span class="amt" style="${+p.monto?'':'color:var(--mu);font-weight:500'}">${mtxt(p)}</span><span class="hm">${ppill(p)}</span>${(st==='pendiente'||st==='vencido')&&!(+p.monto)?`<button class="btn sm" onclick="event.stopPropagation();cargarBoleta('${p.id}')">Cargar boleta</button>`:''}${st==='pendiente'||st==='vencido'?`<button class="btn sm ok" onclick="event.stopPropagation();payNow('${p.id}')">Pagar</button>`:''}</div>`}).join('')}</div>`;

function cargarBoleta(id){const p=G.pago(id);modal(`<h3>Cargar boleta</h3><div class="mu" style="margin-bottom:12px">${esc(p.concepto)}${p.vencimiento?' · vence '+fd(p.vencimiento):''}</div>

async function payNow(id){const p=G.pago(id);modal(`<h3>Registrar pago</h3><div class="mu" style="margin-bottom:12px">${esc(p.concepto)} · ${mtxt(p)}</div>

async function confirmPay(id){const p=G.pago(id);$('#pbtn').disabled=true;const files=$('#pfile').files;const fp=$('#pf').value||TODAY(),monto=parseMonto($('#pm').value),medio=$('#pmed').value;if(!monto){$('#pbtn').disabled=false;$('#pm').focus();toast('Cargá el importe pagado');return}

function delCuenta(id){const c=G.cuenta(id);const n=pagosDe(id).length;confirmBox(`¿Eliminar la cuenta <b>${esc(c.nombre)}</b>? Sus ${n} pago(s) no se borran: quedan sin cuenta.`,'Eliminar',async()=>{await del('cuentas',id);D.pagos.forEach(p=>{if(p.cuenta_id===id)p.cuenta_id=null});closeDr();render()})}
function baseConcepto(s){return String(s||'').replace(new RegExp('\\b('+MESL.join('|')+'|'+MES.join('|')+'|set|sept)\\b','gi'),'').replace(/\b(19|20)\d{2}\b/g,'').replace(/\b\d{1,2}\/\d{2,4}\b/g,'').replace(/[\s\-–·/]+$/,'').replace(/\s{2,}/g,' ').trim()}
function autoCuentas(){const L=D.pagos.filter(p=>!p.cuenta_id&&inEsp(p));const g={};L.forEach(p=>{const b=baseConcepto(p.concepto)||p.concepto;const k=norm(b)+'|'+(p.espacio_id||'');(g[k]=g[k]||{nombre:b,esp:p.espacio_id,ps:[]}).ps.push(p)});window._ag=Object.values(g);
  const ex=n=>D.cuentas.find(c=>norm(c.nombre)===norm(n));
  modal(`<h3>Agrupar pagos sin cuenta</h3><div class="mu" style="font-size:13px;margin-bottom:10px">Se crea una cuenta por cada grupo (o se usa la existente con el mismo nombre) y se le asignan sus pagos. Destildá lo que no quieras.</div><div class="list" style="max-height:50vh;overflow:auto">${window._ag.map((x,i)=>`<label class="li" style="cursor:pointer"><input type="checkbox" id="ag${i}" checked><div class="t"><b>${esc(x.nombre)}</b><span>${x.ps.length} pago${x.ps.length>1?'s':''}${x.esp?' · '+esc(espName(x.esp)):''}${ex(x.nombre)?' · usa la cuenta existente':' · cuenta nueva'}</span></div></label>`).join('')}</div><div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="agb" onclick="doAutoCuentas()">Agrupar</button></div>`)}
async function doAutoCuentas(){$('#agb').disabled=true;let n=0;for(const[i,x]of window._ag.entries()){if(!$('#ag'+i).checked)continue;let c=D.cuentas.find(c=>norm(c.nombre)===norm(x.nombre));
  if(!c){const p0=[...x.ps].sort((a,b)=>(a.vencimiento||'')<(b.vencimiento||'')?1:-1)[0];c=await ins('cuentas',{nombre:x.nombre,espacio_id:x.esp||null,categoria:p0.categoria,monto_habitual:p0.monto,moneda:p0.moneda,recurrencia:p0.recurrencia||'',medio:p0.medio||''})}
  if(c)for(const p of x.ps){await upd('pagos',p.id,{cuenta_id:c.id});n++}}closeModal();render();toast(n+' pagos asignados a cuentas')}
async function loadJSZip(){if(window.JSZip)return;await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar el compresor'));document.head.appendChild(s)})}
async function zipComprobantes(cid){const c=G.cuenta(cid);const ps=pagosDe(cid).filter(p=>CF.anio==='todo'||pFecha(p).startsWith(CF.anio));const docs=D.documentos.filter(d=>d.path&&ps.some(p=>p.id===d.pago_id));if(!docs.length){toast('No hay comprobantes en el período');return}
  toast('Preparando '+docs.length+' comprobantes…');busy(1);try{await loadJSZip();const z=new JSZip();const used={};for(const d of docs){const p=G.pago(d.pago_id);const{data,error}=await sb.storage.from('docs').download(d.path);if(error)throw error;let nm=`${pFecha(p)||'sin-fecha'}_${d.nombre}`;if(used[nm])nm=nm.replace(/(\.[^.]+)?$/,'_'+(++used[nm])+'$1');else used[nm]=1;z.file(nm,data)}
  download(await z.generateAsync({type:'blob'}),`Comprobantes_${slug(c.nombre)}_${CF.anio}.zip`)}catch(e){fail(e)}finally{busy(0)}}

let CQ={mes:TODAY().slice(0,7),tipo:'',tarjeta:''};
const CTIPOS=[['','Todos'],['credito','Tarjeta de crédito'],['debito','Débito'],['transferencia','Transferencias'],['otro','Otros'],['compra','Compras (Rappi y tiendas)']];
const CTL={credito:'Crédito',debito:'Débito',transferencia:'Transferencia',otro:'Otro',compra:'Compra'};
const CTC={credito:'#4c8dff',debito:'#2bb7c4',transferencia:'#b07cff',otro:'#8b93a1',compra:'#e0a43a'};
function tarjKey(c){return (c.tarjeta||CTL[c.tipo]||'Otro')+(c.ultimos4?' ···'+c.ultimos4:'')}
function sumMon(arr){const t={};arr.forEach(c=>{if(+c.monto)t[c.moneda||'ARS']=(t[c.moneda||'ARS']||0)+(+c.monto)});return Object.keys(t).map(k=>money(t[k],k)).join(' + ')||'—'}
function consumosFiltrados(sinTipo){let L=D.consumos.filter(c=>(!CQ.mes||(c.fecha||'').startsWith(CQ.mes))&&matchQ(norm([c.comercio,c.comercio_detalle,c.tarjeta,c.categoria,c.notas,c.asunto].join(' '))));
  if(CQ.tarjeta)L=L.filter(c=>tarjKey(c)===CQ.tarjeta);if(!sinTipo)L=CQ.tipo?L.filter(c=>c.tipo===CQ.tipo):L.filter(c=>c.tipo!=='compra');
  return L.sort((a,b)=>((b.fecha||'')+(b.hora||''))>((a.fecha||'')+(a.hora||''))?1:-1)}
V.consumos=()=>{
  if(NO_CONSUMOS)return `<div class="empty">La sección de consumos todavía no está activada en la base de datos.</div>`;
  if(!D.consumos.length)return `<div class="empty" style="text-align:left;line-height:1.7"><b style="color:var(--tx)">Todavía no hay consumos.</b><br>Se cargan solos desde los avisos de Santander y las compras (Rappi, tiendas) que te llegan al mail, una vez instalado el bot (Ajustes → Bot de mails).</div>`;
  const base=consumosFiltrados(true),L=consumosFiltrados(false);
  const tarjetas=[...new Set(D.consumos.map(tarjKey))].sort();
  const meses=[...new Set(D.consumos.map(c=>(c.fecha||'').slice(0,7)).filter(Boolean))].sort().reverse();
  if(CQ.mes&&!meses.includes(CQ.mes)&&meses.length&&CQ.mes!==TODAY().slice(0,7))CQ.mes=meses[0];
  const seg=`<div class="seg" style="flex-wrap:wrap">${CTIPOS.map(([k,l])=>{const n=k?base.filter(c=>c.tipo===k).length:base.filter(c=>c.tipo!=='compra').length;return (k&&!n)?'':`<button class="${CQ.tipo===k?'on':''}" onclick="CQ.tipo='${k}';render()">${l} <span class="mu2">${n}</span></button>`}).join('')}</div>`;
  const fl=`<div class="filters"><select onchange="CQ.mes=this.value;render()"><option value="">Todos los meses</option>${[...new Set([TODAY().slice(0,7),...meses])].sort().reverse().map(m=>`<option value="${m}" ${CQ.mes===m?'selected':''}>${MESL[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('')}</select><select onchange="CQ.tarjeta=this.value;render()"><option value="">Todas las tarjetas / cuentas</option>${tarjetas.map(t=>`<option ${CQ.tarjeta===t?'selected':''}>${esc(t)}</option>`).join('')}</select>${seg}<div class="sp"></div><button class="btn sm" onclick="exportConsumosCSV()">⤓ Excel / CSV</button><button class="btn sm" onclick="RS.k='consumos';RS.mes=CQ.mes||TODAY().slice(0,7);go('informes')">Informe / PDF</button></div>`;
  // resumen por tarjeta
  const porT={};L.forEach(c=>(porT[tarjKey(c)]=porT[tarjKey(c)]||[]).push(c));
  const tcards=`<div class="sum">${`<div class="kpi"><div class="l">Total ${CQ.mes?MESL[+CQ.mes.slice(5)-1].toLowerCase():'período'}</div><div class="v" style="font-size:20px">${sumMon(L)}</div><div class="s">${L.length} movimiento${L.length===1?'':'s'}${CQ.tipo==='compra'?' · no suman al total general (ya se pagan con tarjeta)':''}</div></div>`}${Object.keys(porT).sort((a,b)=>porT[b].length-porT[a].length).slice(0,4).map(k=>{const t=porT[k][0].tipo;return `<div class="kpi" style="border-top:3px solid ${CTC[t]};cursor:pointer" onclick="CQ.tarjeta=CQ.tarjeta===${JSON.stringify(k).replace(/"/g,'&quot;')}?'':${JSON.stringify(k).replace(/"/g,'&quot;')};render()"><div class="l">${esc(k)}</div><div class="v" style="font-size:18px">${sumMon(porT[k])}</div><div class="s">${porT[k].length} mov.</div></div>`}).join('')}</div>`;
  // top comercios
  const porC={};L.forEach(c=>{const k=c.comercio||'(sin comercio)';(porC[k]=porC[k]||[]).push(c)});
  const top=Object.keys(porC).sort((a,b)=>porC[b].reduce((s,c)=>s+(+c.monto||0),0)-porC[a].reduce((s,c)=>s+(+c.monto||0),0)).slice(0,6);
  // lista por día
  const porD={};L.forEach(c=>(porD[c.fecha||'']=porD[c.fecha||'']||[]).push(c));
  const lista=Object.keys(porD).sort().reverse().map(d=>`<div class="li" style="cursor:default;min-height:34px;background:var(--p2)"><div class="t"><b style="font-size:12.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px">${d?new Date(d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}):'Sin fecha'}</b></div><span class="amt mu" style="font-size:12.5px">${sumMon(porD[d])}</span></div>${porD[d].map(c=>`<div class="li" style="box-shadow:inset 3px 0 0 ${CTC[c.tipo]||'#888'}" onclick="editConsumo('${c.id}')"><span class="mu2 num" style="width:40px;font-size:12px">${c.hora?c.hora.slice(0,5):''}</span><div class="t"><b>${esc(c.comercio||c.asunto||'Movimiento')}</b><span>${[tarjKey(c),c.cuotas>1?c.cuotas+' cuotas':'',c.comercio_detalle,c.notas].filter(Boolean).map(esc).join(' · ')}</span></div>${c.categoria?`<span class="pill hm" style="color:var(--mu);border-color:var(--bd2)">${esc(c.categoria)}</span>`:''}<span class="amt">${money(c.monto,c.moneda)}</span></div>`).join('')}`).join('');
  return fl+tcards+`<div class="grid2 wide"><div>${L.length?`<div class="list">${lista}</div>`:'<div class="empty">Sin movimientos con estos filtros.</div>'}</div><div><div class="sec" style="margin-top:0"><h2>Dónde más gastaste</h2>${top.length?`<div class="list">${top.map(k=>`<div class="li" onclick="$('#q').value='${esc(k).replace(/'/g,'')}';Q=$('#q').value;render()"><div class="t"><b>${esc(k)}</b><span>${porC[k].length} movimiento${porC[k].length>1?'s':''}</span></div><span class="amt">${sumMon(porC[k])}</span></div>`).join('')}</div>`:'<div class="empty">—</div>'}</div></div></div>`;
};

  modal(`<h3>${esc(c.comercio||'Movimiento')}</h3><div class="mu" style="margin-bottom:12px">${money(c.monto,c.moneda)} · ${fd(c.fecha)} ${c.hora?c.hora.slice(0,5):''} · ${esc(tarjKey(c))}${c.cuotas>1?' · '+c.cuotas+' cuotas':''}</div>

async function saveConsumo(id){const c=D.consumos.find(x=>x.id===id);const cat=$('#kca').value.trim(),com=$('#kc').value.trim(),all=$('#kall').checked;const orig=c.comercio;

function exportConsumosCSV(){const rows=[['Fecha','Hora','Tipo','Tarjeta / cuenta','Comercio','Detalle','Cuotas','Moneda','Monto','Categoría','Notas']];consumosFiltrados(false).slice().reverse().forEach(c=>rows.push([fd(c.fecha),c.hora?c.hora.slice(0,5):'',CTL[c.tipo]||c.tipo,tarjKey(c),c.comercio,c.comercio_detalle,c.cuotas||'',c.moneda,String(c.monto).replace('.',','),c.categoria,c.notas]));download(new Blob([csv(rows)],{type:'text/csv;charset=utf-8'}),'Consumos_'+(CQ.mes||'todos')+'.csv')}

V.agenda=()=>{
  const [y,m]=CAL.m.split('-').map(Number);const first=new Date(y,m-1,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const from=localISO(start),to=addDays(from,41);
  const items=agendaItems(from,to,{paid:true,prev:true});const by={};items.forEach(i=>(by[i.fecha]=by[i.fecha]||[]).push(i));
  let cells='';for(let i=0;i<42;i++){const d=addDays(from,i);const its=by[d]||[];const out=+d.slice(5,7)!==m;
    cells+=`<div class="d ${out?'out':''} ${d===TODAY()?'today':''} ${d===CAL.sel?'sel':''}" onclick="CAL.sel='${d}';render()"><span class="n">${+d.slice(8)}</span>${its.slice(0,3).map(it=>`<div class="ev" style="border-color:${it.color};background:${it.prev?'transparent':it.color+'22'};${it.done?'opacity:.55':''}${it.prev?';border-left-style:dashed;color:var(--mu)':''}">${esc(it.titulo)}</div>`).join('')}${its.length>3?`<div class="mu2" style="font-size:10.5px">+${its.length-3}</div>`:''}</div>`}
  const head=`<div class="filters"><button class="btn sm" onclick="calMove(-1)">‹</button><b style="min-width:150px;text-align:center">${MESL[m-1]} ${y}</b><button class="btn sm" onclick="calMove(1)">›</button><button class="btn sm ghost" onclick="CAL.m=TODAY().slice(0,7);CAL.sel=TODAY();render()">Hoy</button><div class="sp"></div><span class="hm" style="display:flex;gap:10px;font-size:12px;color:var(--mu)"><span class="etag"><span class="dot" style="background:#e0a43a"></span>Pago</span><span class="etag"><span class="dot" style="background:#b07cff"></span>Recordatorio</span><span class="etag"><span class="dot" style="background:#4c8dff"></span>Objetivo de tema</span><span class="etag"><span class="dot" style="border:1px dashed #e0a43a;background:transparent"></span>Previsto</span></span><select title="Proyección de pagos recurrentes" onchange="PROY=+this.value;localStorage.setItem('tb_proy',PROY);render()">${[12,18,24,36].map(n=>`<option value="${n}" ${PROY===n?'selected':''}>Proyectar ${n} meses</option>`).join('')}</select><button class="btn sm" onclick="newPago(CAL.sel)">+ Pago</button><button class="btn sm pri" onclick="newRec(CAL.sel)">+ Recordatorio</button></div>`;
  const cal=`<div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="h">${d}</div>`).join('')}${cells}</div>`;
  const sel=agendaItems(CAL.sel,CAL.sel,{paid:true,prev:true});
  const day=`<div class="sec"><h2>${new Date(CAL.sel+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</h2>${sel.length?`<div class="list">${sel.map(itemRow).join('')}</div>`:'<div class="empty">Nada este día.</div>'}</div>`;
  const prox=agendaItems(TODAY(),addDays(TODAY(),30));
  const px=`<div class="sec"><h2>Próximos 30 días</h2>${prox.length?`<div class="list">${prox.map(itemRow).join('')}</div>`:'<div class="empty">Sin vencimientos ni recordatorios.</div>'}</div>`;
  const pr=projections({});const byM={};pr.forEach(i=>{const k=i.fecha.slice(0,7);(byM[k]=byM[k]||[]).push(i)});
  const pv=`<div class="sec"><h2>Previstos · próximos ${PROY} meses</h2>${pr.length?`<div class="list">${Object.keys(byM).sort().map(k=>{const its=byM[k];const t={};its.forEach(i=>{const p=G.pago(i.id);if(p)t[p.moneda]=(t[p.moneda]||0)+(+p.monto||0)});return `<div class="li" onclick="CAL.m='${k}';CAL.sel='${k}-01';render();window.scrollTo(0,0)"><div class="t"><b>${MESL[+k.slice(5)-1]} ${k.slice(0,4)}</b><span>${its.length} vencimiento${its.length>1?'s':''} · ${esc(its.map(i=>i.titulo).slice(0,3).join(', '))}${its.length>3?'…':''}</span></div><span class="amt">${Object.keys(t).map(m=>money(t[m],m)).join(' + ')}</span></div>`}).join('')}</div>`:'<div class="empty">Sin pagos recurrentes cargados.</div>'}</div>`;
  return head+`<div class="grid2 wide"><div>${cal}</div><div>${day}${px}${pv}</div></div>`;
};
function calMove(n){const[y,m]=CAL.m.split('-').map(Number);const d=new Date(y,m-1+n,1);CAL.m=localISO(d).slice(0,7);render()}

async function uploadFiles(files,meta){let n=0;for(const f of files){if(f.size>50*1024*1024){toast(f.name+' supera 50 MB');continue}busy(1);try{const path=`${USER.id}/${uid()}-${slug(f.name.replace(/\.[^.]+$/,''))}.${ext(f.name)==='—'?'bin':ext(f.name).toLowerCase()}`;const{error}=await sb.storage.from('docs').upload(path,f,{contentType:f.type||'application/octet-stream'});if(error)throw error;await ins('documentos',{...meta,nombre:f.name,path,size:f.size,mime:f.type});n++}catch(e){fail(e)}finally{busy(0)}}
  if(n)toast(n+' archivo'+(n>1?'s':'')+' subido'+(n>1?'s':''));return n}

function topicBlock(t,full){
  const ps=pendsOf(t.id),open=ps.filter(p=>!p.hecho),done=ps.filter(p=>p.hecho);
  let logs=logsOf(t.id).filter(b=>RS.sys||b.tipo==='usr');if(!full)logs=logs.slice(-3);logs=[...logs].reverse();const docs=docsOf('tema_id',t.id);

  ${logs.length?`<div class="lbl">${full?'Bitácora':'Últimos avances'}</div><table class="lg">${logs.map(b=>`<tr><td class="d">${fd(b.fecha)}</td><td class="pre">${esc(b.texto)}</td></tr>`).join('')}</table>`:''}

    const tot=(arr)=>{const t={};arr.filter(p=>+p.monto).forEach(p=>t[p.moneda]=(t[p.moneda]||0)+(+p.monto));const nz=arr.filter(p=>!(+p.monto)).length;return (Object.keys(t).map(k=>money(t[k],k)).join(' + ')||'—')+(nz?` · ${nz} a confirmar`:'')};
    const pg=L.filter(p=>p.estado==='Pagado'),pe=L.filter(p=>p.estado!=='Pagado');

    name='Pagos_'+RS.mes;
  }
  return{html:`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(name)}</title><style>${RCSS}</style></head><body>${body}</body></html>`,name:name+'_'+TODAY()+'.html'};
}

function editEsp(id){const e=id?G.esp(id):null;window._ec=e?e.color:ECOLORS[D.espacios.length%ECOLORS.length];

/* ---------- Exportaciones ---------- */
function csv(rows){return '\ufeff'+rows.map(r=>r.map(c=>{c=String(c??'');return /[;"\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n')}
function exportTemasCSV(){const rows=[['Espacio','Proyecto','Tema','Estado','Prioridad','Contraparte','Alta','Objetivo','Última actualización','Pendientes abiertos','Último avance']];D.temas.filter(inEsp).forEach(t=>{const s=pendStat(t.id),lu=lastUser(t.id);rows.push([espName(t.espacio_id),projName(t.proyecto_id),t.titulo,t.estado,t.prioridad,t.contraparte,fd(t.alta),fd(t.objetivo),fdt(t.actualizado),s.open,lu?lu.texto:''])});download(new Blob([csv(rows)],{type:'text/csv;charset=utf-8'}),'Temas_'+TODAY()+'.csv')}
function exportPagosCSV(L,nm){const rows=[['Espacio','Cuenta','Concepto','Categoría','Vencimiento','Estado','Fecha de pago','Medio','Moneda','Monto','Recurrencia','Notas']];(L||[]).forEach(p=>rows.push([espName(p.espacio_id),cuentaName(p.cuenta_id),p.concepto,p.categoria,fd(p.vencimiento),p.estado==='Pagado'?'Pagado':pagoSt(p)==='vencido'?'Vencido':p.estado,fd(p.fecha_pago),p.medio,p.moneda,String(p.monto).replace('.',','),recLabel(p.recurrencia),p.notas]));download(new Blob([csv(rows)],{type:'text/csv;charset=utf-8'}),'Pagos_'+(nm?nm+'_':'')+TODAY()+'.csv')}
function exportDocsCSV(){const rows=[['Documento','Categoría','Espacio','Tema','Pago','Nota','Fecha','Tamaño','Link']];D.documentos.filter(inEsp).forEach(d=>rows.push([d.nombre,d.categoria,espName(d.espacio_id),(G.tema(d.tema_id)||{}).titulo||'',(G.pago(d.pago_id)||{}).concepto||'',d.nota,fd(d.creado),d.size?fsize(d.size):'',d.url||'']));download(new Blob([csv(rows)],{type:'text/csv;charset=utf-8'}),'Documentos_'+TODAY()+'.csv')}
function exportJSON(){download(new Blob([JSON.stringify({app:'tablero-max',exportado:now(),datos:D},null,1)],{type:'application/json'}),'Respaldo_Tablero_'+TODAY()+'.json')}

/* ===================== Calendario externo ===================== */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function calDates(fecha,hora){if(hora){const s=fecha.replace(/-/g,'')+'T'+hora.slice(0,5).replace(':','')+'00';const d=new Date(fecha+'T'+hora.slice(0,5)+':00');d.setMinutes(d.getMinutes()+30);const e=localISO(d).replace(/-/g,'')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';return[s,e,false]}return[fecha.replace(/-/g,''),addDays(fecha,1).replace(/-/g,''),true]}
function toICS(title,fecha,hora,desc){const[s,e,allDay]=calDates(fecha,hora);const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tablero Max//ES','BEGIN:VEVENT','UID:'+uid()+'@tablero-max','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',allDay?'DTSTART;VALUE=DATE:'+s:'DTSTART:'+s,allDay?'DTEND;VALUE=DATE:'+e:'DTEND:'+e,'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc(desc),'BEGIN:VALARM','TRIGGER:'+(allDay?'-PT15H':'-PT30M'),'ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'END:VALARM','END:VEVENT','END:VCALENDAR'];download(new Blob([L.join('\r\n')],{type:'text/calendar'}),slug(title)+'.ics')}
function gcal(title,fecha,hora,desc){const[s,e]=calDates(fecha,hora);window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${s}/${e}&details=${encodeURIComponent(desc||'')}${hora?'&ctz=America/Argentina/Buenos_Aires':''}`,'_blank')}
function calBtns(kind,id){return `<button class="btn sm" onclick="calOut('${kind}','${id}','g')">📅 Google Calendar</button><button class="btn sm" onclick="calOut('${kind}','${id}','i')">⤓ .ics (iPhone/Outlook)</button>`}
function calOut(kind,id,how){let t,f,h=null,d='';if(kind==='pago'){const p=G.pago(id);if(!p.vencimiento){toast('Cargá el vencimiento primero');return}t='Vence: '+p.concepto;f=p.vencimiento;d=[money(p.monto,p.moneda),p.categoria,p.notas].filter(Boolean).join(' · ')}else if(kind==='rec'){const r=G.rec(id);t=r.titulo;f=r.fecha;h=r.hora;d=r.notas}else{const tm=G.tema(id);if(!tm.objetivo){toast('Cargá la fecha objetivo primero');return}t='Objetivo: '+tm.titulo;f=tm.objetivo;d=tm.descripcion}
  how==='g'?gcal(t,f,h,d):toICS(t,f,h,d)}

function drRec(){const r=G.rec(DR.id);if(!r)return null;
  return `<div class="dh"><input class="ttl" value="${esc(r.titulo)}" onchange="rUpd('titulo',this.value.trim()||'Recordatorio')"><button class="btn ghost" onclick="closeDr()">✕</button></div>
  <div class="db"><div class="fg"><div class="f"><label>Fecha</label><input type="date" value="${r.fecha}" onchange="rUpd('fecha',this.value||TODAY())"></div><div class="f"><label>Hora</label><input type="time" value="${r.hora?r.hora.slice(0,5):''}" onchange="rUpd('hora',this.value||null)"></div><div class="f"><label>Espacio</label><select onchange="rUpd('espacio_id',this.value||null)">${espOpts(r.espacio_id,true)}</select></div>
  <div class="f" style="grid-column:1/-1"><label>Tema</label><select onchange="rUpd('tema_id',this.value||null)"><option value="">—</option>${D.temas.map(t=>`<option value="${t.id}" ${t.id===r.tema_id?'selected':''}>${esc(t.titulo)}</option>`).join('')}</select></div></div>
  <div class="ds"><h3>Notas</h3><textarea rows="4" onchange="rUpd('notas',this.value)">${esc(r.notas)}</textarea></div>
  <label class="ck2" style="margin-top:16px"><input type="checkbox" ${r.hecho?'checked':''} onchange="recDone('${r.id}')"> Hecho</label></div>
  <div class="df">${calBtns('rec',r.id)}<div class="sp"></div><button class="btn danger" onclick="confirmBox('¿Eliminar el recordatorio?','Eliminar',async()=>{await del('recordatorios','${r.id}');closeDr();render()})">Eliminar</button></div>`}
async function rUpd(k,v){await upd('recordatorios',DR.id,{[k]:v});render()}

/* ===================== Modales ===================== */
function modal(html){const m=$('#modal');m.innerHTML=`<div class="mb" onmousedown="if(event.target===this)closeModal()"><div class="mc">${html}</div></div>`;m.style.display='block';const f=m.querySelector('input:not([type=file]):not([type=checkbox]),textarea');if(f&&window.innerWidth>860)f.focus()}
function closeModal(){const m=$('#modal');if(m.style.display!=='block')return false;m.style.display='none';m.innerHTML='';return true}
function confirmBox(msg,ok,fn){window._cf=fn;modal(`<h3>Confirmar</h3><p style="line-height:1.5">${msg}</p><div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="closeModal();_cf()">${ok}</button></div>`)}

/* ===================== Login ===================== */
function showLogin(){$('#app').classList.add('hide');$('#login').classList.remove('hide')}
async function doLogin(){const e=$('#le').value.trim(),p=$('#lp').value;$('#lerr').textContent='';if(!e||!p){$('#lerr').textContent='Completá mail y contraseña';return}
  const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){$('#lerr').textContent=error.message==='Invalid login credentials'?'Mail o contraseña incorrectos':error.message;return}start(data.user)}
async function doSignup(){const e=$('#le').value.trim(),p=$('#lp').value;$('#lerr').textContent='';if(!e||p.length<8){$('#lerr').textContent='Ingresá mail y una contraseña de al menos 8 caracteres';return}
  const{data,error}=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});if(error){$('#lerr').textContent=/disabled|not allowed/i.test(error.message)?'El registro de usuarios nuevos está cerrado.':error.message;return}
  if(data.session)start(data.user);else $('#lerr').innerHTML='<span class="okc">Usuario creado. Revisá tu mail para confirmarlo y después ingresá.</span>'}
async function doReset(){const e=$('#le').value.trim();if(!e){$('#lerr').textContent='Escribí tu mail arriba';return}const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});$('#lerr').innerHTML=error?esc(error.message):'<span class="okc">Te enviamos un mail para restablecer la contraseña.</span>'}
async function start(u){USER=u;loadFeriados();$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#main').innerHTML='<div class="empty">Cargando…</div>';await loadAll();
  if(!D.espacios.length){await insMany('espacios',[{nombre:'Ceta',color:'#4c8dff',orden:0},{nombre:'EFM',color:'#b07cff',orden:1},{nombre:'Personal',color:'#2fb67c',orden:2}])}
  if(ESP&&!G.esp(ESP))ESP='';render()}

/* ===================== Eventos ===================== */
$('#q').addEventListener('input',e=>{Q=e.target.value;if(['inicio','agenda','proyectos','informes','ajustes'].includes(VIEW)&&Q.trim())VIEW='temas';render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(closeModal())return;if(DR){closeDr();return}}
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.target.isContentEditable||e.ctrlKey||e.metaKey||e.altKey||!USER)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus()}else if(e.key==='n'||e.key==='N'){e.preventDefault();quickAdd()}});
window.addEventListener('dragover',e=>{if(!e.target.closest||!e.target.closest('#drop,.col'))e.preventDefault()});
window.addEventListener('drop',e=>{if(!e.target.closest||!e.target.closest('#drop,.col'))e.preventDefault()});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&USER&&Date.now()-lastLoad>60000&&!$('#modal').innerHTML){await loadAll();render()}});
const _saveProj=saveProj;saveProj=async function(id){const before=D.proyectos.length;await _saveProj(id);if(window._afterProj&&DR&&DR.k==='tema'&&D.proyectos.length>before){window._afterProj=false;const np=D.proyectos[D.proyectos.length-1];await upd('temas',DR.id,{proyecto_id:np.id,espacio_id:np.espacio_id,actualizado:now()});render()}};

sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){if(session)start(session.user).then(()=>chgPass())}if(ev==='SIGNED_OUT'){USER=null;showLogin()}});
(async()=>{const{data:{session}}=await sb.auth.getSession();if(session&&session.user)start(session.user);else showLogin()})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
